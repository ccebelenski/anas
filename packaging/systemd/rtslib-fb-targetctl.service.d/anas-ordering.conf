# ANAS ordering drop-in for rtslib-fb-targetctl.service (story iscsi.5).
#
# A DROP-IN, never an edit of the vendor unit: the unit belongs to
# python3-rtslib-fb and ANAS is a guest on this system (PRINCIPLES.md #12). An
# apt upgrade of the package replaces /usr/lib/systemd/system/... and leaves
# this file untouched; uninstall.sh removes only this file and its directory.
#
# WHY THIS EXISTS
# ---------------
# The shipped unit orders itself after sys-kernel-config.mount, network.target
# and local-fs.target, and after NOTHING to do with storage:
#
#     [Unit]
#     Requires=sys-kernel-config.mount
#     After=sys-kernel-config.mount network.target local-fs.target
#     ExecStart=/usr/bin/targetctl restore
#     ExecStop=/usr/bin/targetctl clear
#
# Nothing in that chain waits for /dev/zvol/* to appear. And a restore whose
# backing device is missing is NOT an error: targetctl collects the per-object
# failures and prints them without ever turning one into an exit code, so the
# unit finishes "Result=success" while the LUN silently vanishes — and with a
# whole pool late, the target comes up enabled and listening with ZERO LUNs
# while an initiator logs in happily and sees no disks. No Restart= and no
# OnFailure= can catch that. (docs/ISCSI-GROUND-TRUTH.md GT-3, GT-20, GT-21.)
#
# A real reboot of the ground-truth node did restore cleanly, with a 1.23 s gap
# between zfs-volume-wait finishing and the restore starting — but that gap was
# COINCIDENCE, not a dependency: that node's two pools were file vdevs importing
# in 270 ms. On real disks the import is seconds to minutes and the race is lost
# (GT-47).
#
# SHUTDOWN IS THE SAME LINE, READ BACKWARDS
# -----------------------------------------
# `After=` is also "stop BEFORE", by definition: systemd stops a unit before the
# units it is ordered after. So this one directive gives both halves —
# ExecStop=/usr/bin/targetctl clear runs before the ZFS volumes and the local
# filesystems go away, which is what keeps a pool export at shutdown from
# hitting `dataset is busy` on a zvol LIO still holds open (GT-40). No separate
# Before= is needed or wanted.
#
# WHAT EACH ANCHOR IS FOR
# -----------------------
# zfs-volume-wait.service   runs `zvol_wait` — the ONLY thing on the system that
#                           waits for the /dev/zvol/<pool>/<vol> symlinks a
#                           zvol-backed LUN is stored as. It is ConditionPath-
#                           gated on /sys/module/zfs, so on a node without ZFS
#                           it is skipped, not failed.
# zfs-volumes.target        the target that requires the above; the documented
#                           "ZFS volumes are ready" anchor. Named as well as the
#                           service so the ordering survives either being
#                           reorganised upstream.
# zfs-mount.service         datasets mounted — a fileio LUN's image file lives
#                           on one. (local-fs.target already implies this on a
#                           stock node; naming it is free and explicit.)
# zfs-import.target         reached via the two above; covers BOTH
#                           zfs-import-cache.service and the per-pool
#                           zfs-import@<pool>.service that ANAS's own
#                           services/zfs-import-unit.ts enables (issue #22).
# local-fs.target           already in the vendor unit; restated here so this
#                           file documents the whole ordering in one place, and
#                           so a future vendor unit that drops it does not
#                           silently take the AHR half with it.
#
# Wants= (not Requires=) throughout: fail-open is the rule. A node with no ZFS
# must still restore whatever LIO config it has, and a failed zvol_wait must
# degrade to "restore anyway, ANAS reports the hole", never to "no iSCSI at all".
#
# AHR — THE HONEST LIMIT
# ----------------------
# An AHR pool comes up as md assembly (udev) -> LVM activation (udev, event-
# based) -> an ordinary /etc/fstab mount of the pool's btrfs LV. There is no
# ANAS unit in that path and no per-node-invariant unit that means "AHR is
# mounted": the generated mount units are named after each pool's mountpoint.
# local-fs.target is therefore the only static anchor available — and it is a
# WEAK one, because ANAS writes AHR entries with `nofail` (a pool must never
# hold the host's boot hostage), and systemd deliberately does not order a
# `nofail` mount before local-fs.target (systemd.mount(5)).
#
# So an AHR-backed image LUN can still lose the race on a slow array assembly.
# That residual hole is exactly what /v1/iscsi/health surfaces as an `iscsi`
# dashboard warning and what POST /v1/iscsi/health/repair puts back — with the
# stored serial and attributes replayed, so it is the same disk.

[Unit]
Wants=zfs-volumes.target zfs-volume-wait.service
After=zfs-volumes.target zfs-volume-wait.service zfs-mount.service zfs-import.target
After=local-fs.target
