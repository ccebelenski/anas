# Release pipeline (Epic 10.10 tail): tag push vX.Y.Z -> make-release.sh
# (version-drift guard + build + pruned node_modules + boot smoke test) ->
# tarball attached to a GitHub Release. make-release.sh is the shared
# local/CI build core — this workflow adds nothing it doesn't do locally.
#
# TWO JOBS, two token scopes (2026-10-14 review W3, closed by cr.61). `build`
# installs dependencies, runs every gate and builds the tarball with a
# READ-ONLY token that is not persisted into the checkout; it hands the tarball
# on as a workflow artifact. Only `publish` holds `contents: write`, on a fresh
# runner that installs and runs nothing from npm — so no dependency's code ever
# runs beside the write token. Actions are pinned to commits, as in ci.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - run: npm ci --ignore-scripts

      # make-release's tag step needs a git identity if it ever creates the
      # tag; on a tag-push the tag is already at HEAD, so this is insurance.
      # The tag is never pushed from here (the checkout holds no credentials).
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Ruling (k): tests gate the release; the CI gates are repeated here so a
      # tag cannot publish a commit whose CI is not green.
      - name: Install Perl dependencies for tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwww-perl liburi-perl
      - run: npm run build
      - run: npx tsc -p tests/integration/tsconfig.json
      - run: npm run test:unit
      - run: TZ=Pacific/Kiritimati npm run test:unit:daemon
      - run: npm run lint

      - name: Build release (make-release.sh)
        run: ./packaging/make-release.sh

      # Refuse here, before anything is uploaded: hand-written notes are part of
      # the tagged commit or there is no release (the publish job reads them).
      - name: Require release notes
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ ! -f "${NOTES}" ]; then
            echo "ERROR: release notes ${NOTES} not found in the tagged commit — refusing to publish." >&2
            echo "Add hand-written notes at ${NOTES} and re-tag." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: dist-release/anas-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for the notes file; no npm, no build, no credentials in .git.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: dist-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/release-notes/${VERSION}.md"
          # This repo commits direct to main (no PRs), so `--generate-notes`
          # yields EMPTY notes (it summarizes merged PRs). Notes are hand-written
          # per release and committed to the tagged commit; refuse to publish
          # without them so the pipeline can never ship an empty release again.
          if [ ! -f "${NOTES}" ]; then
            echo "ERROR: release notes ${NOTES} not found in the tagged commit — refusing to publish." >&2
            echo "Add hand-written notes at ${NOTES} and re-tag." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist-release/anas-${VERSION}.tar.gz" \
            --title "ANAS ${VERSION}" \
            --notes-file "${NOTES}"
