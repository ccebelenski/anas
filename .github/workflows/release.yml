# Release pipeline (Epic 10.10 tail): tag push vX.Y.Z -> make-release.sh
# (version-drift guard + build + pruned node_modules + boot smoke test) ->
# tarball attached to a GitHub Release. make-release.sh is the shared
# local/CI build core — this workflow adds nothing it doesn't do locally.
#
# TWO JOBS, two token scopes (2026-10-14 review W3, closed by cr.61). `build`
# installs dependencies, runs every gate and builds the tarball with a
# READ-ONLY token that is not persisted into the checkout; it hands the tarball
# on as a workflow artifact. Only `publish` holds `contents: write`, on a fresh
# runner that installs and runs nothing from npm — so no dependency's code ever
# runs beside the write token. Actions are pinned to commits, as in ci.yml.
#
# THE GATES ARE NOT RE-RUN HERE (release.1, 0.4.4 retrospective ruling (p)):
# `build` looks up the CI workflow's conclusion for the tagged commit and
# refuses unless one completed run on that exact sha concluded `success`.
# Ruling (n) is what this enforces mechanically — main is pushed, CI passes
# on the exact commit, then the tag is cut; a tag on a commit CI never ran
# cannot release. CI runs on every push to main, never on a tag push, so the
# run this step finds is main's. Ruling (k) still holds: the tests gate the
# tag, through that run.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to list the CI runs for the tagged commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      # release.1: the tagged commit must have a completed, successful CI
      # run. HEAD after the checkout is the commit the tag points to (an
      # annotated tag is peeled by the checkout), and only runs whose
      # head_sha is exactly that commit count — a green run on a parent is
      # not a green run on this commit. The gh CLI is preinstalled on the
      # runner and reads with the job's own token (actions: read).
      - name: Require a green CI run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA="$(git rev-parse HEAD)"
          RUNS="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=50" \
            --jq '.workflow_runs[] | [.status, (.conclusion // "none"), .html_url] | @tsv')"
          if [ -z "${RUNS}" ]; then
            echo "ERROR: no CI run exists for commit ${SHA} (tag ${GITHUB_REF_NAME}) — push main, let CI pass on this exact commit, then tag it (ruling (n))." >&2
            exit 1
          fi
          echo "CI runs on ${SHA}:"
          echo "${RUNS}"
          if ! printf '%s\n' "${RUNS}" | grep -q $'^completed\tsuccess\t'; then
            echo "ERROR: no completed CI run on commit ${SHA} concluded success — refusing to release ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - run: npm ci --ignore-scripts

      # make-release's tag step needs a git identity if it ever creates the
      # tag; on a tag-push the tag is already at HEAD, so this is insurance.
      # The tag is never pushed from here (the checkout holds no credentials).
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Ruling (k) via ruling (p): the tests gated this commit in the CI run
      # checked above; they are not repeated here. Build and package only.
      - run: npm run build

      - name: Build release (make-release.sh)
        run: ./packaging/make-release.sh

      # Refuse here, before anything is uploaded: hand-written notes are part of
      # the tagged commit or there is no release (the publish job reads them).
      - name: Require release notes
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ ! -f "${NOTES}" ]; then
            echo "ERROR: release notes ${NOTES} not found in the tagged commit — refusing to publish." >&2
            echo "Add hand-written notes at ${NOTES} and re-tag." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: dist-release/anas-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for the notes file; no npm, no build, no credentials in .git.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: dist-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/release-notes/${VERSION}.md"
          # This repo commits direct to main (no PRs), so `--generate-notes`
          # yields EMPTY notes (it summarizes merged PRs). Notes are hand-written
          # per release and committed to the tagged commit; refuse to publish
          # without them so the pipeline can never ship an empty release again.
          if [ ! -f "${NOTES}" ]; then
            echo "ERROR: release notes ${NOTES} not found in the tagged commit — refusing to publish." >&2
            echo "Add hand-written notes at ${NOTES} and re-tag." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist-release/anas-${VERSION}.tar.gz" \
            --title "ANAS ${VERSION}" \
            --notes-file "${NOTES}"
