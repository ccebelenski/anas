#
# SYNTHETIC input, TOOL-CHECKED (cr3.shares H1): written by hand to exercise
# every section-header form Samba's reader accepts; the companion file
# smb-section-headers.testparm is the verbatim stdout of
#   testparm -s smb-section-headers.conf
# (Samba 4.25.1, 2026-11-14) -- what Samba itself reads from this file.
# Share names and paths are scaffolding, not anyone's configuration.
#
[global] # the server
	workgroup = WG
	server string = Header   Torture\
 Server

[public]
	path = /srv/public
	read only = yes

[private] ; staff only
	path = /srv/private
	valid users = alice;bob

[odd]x
	path = /srv/odd

[a]b]
	path = /srv/ab

   [indented]
	path = /srv/indented

[tabbed]	# trailing tab comment
	path = /srv/tabbed

[contin\
ued]
	path = /srv/continued

[My   Space]
	path = /srv/My  Space

[swallow] ; note \
	path = /srv/swallowed-into-the-header
	comment = no path here

[valuecont]
	path = /srv/value \
[not-a-header]
	comment = after a continued value

[merged]
	path = /srv/merged-one
	comment = first

[MERGED]
	comment = second
 [nbsp]
	browseable = no

[ Glo bal ]
	server string = Late Global
