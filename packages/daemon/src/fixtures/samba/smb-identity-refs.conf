#
# SYNTHETIC -- authored for the cr.30 tests, NOT captured from a machine.
# One share per user-list parameter the identity delete refusal scans
# (WAVE2-DESIGN section 6 C4), each naming a distinct account, and every
# group form the design names: @group, +group and &group, plus `force
# group` in both its sigiled and bare spelling. The account names are
# test scaffolding, not operator accounts.
#

[global]
	workgroup = WORKGROUP

[valid-users]
	path = /tank/valid
	valid users = vuser @vgroup

[invalid-users]
	path = /tank/invalid
	invalid users = iuser &igroup

[read-list]
	path = /tank/read
	read list = ruser +rgroup

[write-list]
	path = /tank/write
	write list = wuser @wgroup

[admin-users]
	path = /tank/admin
	admin users = auser @agroup

[force-user]
	path = /tank/forceu
	force user = fuser

[force-group-at]
	path = /tank/forcega
	force group = @fgroupat

[force-group-bare]
	path = /tank/forcegb
	force group = fgroupbare
