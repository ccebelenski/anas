#
# CAPTURED input (cr4.conf D-4, 2026-11-15, PVE 9 node): a stanza whose
# comment ends in a backslash followed by ONE trailing blank, then the
# stanza's own path line. The two parameter lines and their three-blank
# indentation are the capture; the stanza name is scaffolding. The
# companion file smb-continuation-blank.testparm records what Samba reads
# from it (testparm -s, Samba 4.22.11): a backslash followed only by
# blanks before the newline IS a continuation, so Samba reads ONE
# parameter here and the stanza has no `path`.
#
[storage]
   comment = Storage \ 
   path = /srv/a
