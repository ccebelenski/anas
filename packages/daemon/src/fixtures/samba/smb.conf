#
# Sample smb.conf for ANAS --mock / dev mode.
# Realistic: [global], a couple of shares, comments, an unknown directive,
# odd whitespace, and an alternate parameter spelling.
#

[global]
	workgroup = WORKGROUP
	server string = ANAS Storage
	interfaces = lo eth0 10.0.0.0/24
	bind interfaces only = yes
	# a directive ANAS doesn't model — must be preserved verbatim
	log level = 1
	map to guest = Bad User

[media]
	comment = Media library
	path = /tank/media
	browseable = yes
	read only = no
	guest ok = no
	valid users = media @smbusers

[backups]
	comment = Nightly backups
	path = /tank/backups
	# alternate spelling of browseable, and hosts allow list
	browsable = yes
	read only = yes
	hosts allow = 10.0.0.0/24 192.168.1.
	hosts deny = 0.0.0.0/0
