# PVE installer default storage.cfg on a ZFS-root node (story cr.60): `local-zfs` carries `pool rpool/data` and NO `mountpoint` key.
# NOT a node capture (no ZFS-root node in the fleet to capture from) — the stanzas the PVE 9 installer writes; replace with a capture when one exists.
dir: local
	path /var/lib/vz
	content iso,vztmpl,backup

zfspool: local-zfs
	pool rpool/data
	sparse
	content images,rootdir
