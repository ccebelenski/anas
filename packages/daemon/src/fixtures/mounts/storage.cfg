zfspool: datapool
	pool datapool
	content images,rootdir
	mountpoint /datapool
	nodes anas-pve

dir: local
	path /var/lib/vz
	content images,snippets,iso,backup,rootdir,vztmpl
	prune-backups keep-all=1

dir: anastest-dir
	path /srv/pve-dir
	content iso,backup

nfs: anastest-nfs
	export /srv/nfs/export1
	path /mnt/pve/anastest-nfs
	server 127.0.0.1
	content backup
	options vers=4.2

